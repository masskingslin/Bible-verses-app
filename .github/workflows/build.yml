name: Build Holy Bible APK + AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [ debug, release ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages
        run: npm ci

      - name: Install Capacitor plugins (TTS, AdMob)
        run: |
          npm install @capacitor-community/text-to-speech@5.0.0 --legacy-peer-deps
          npm install @capacitor-community/admob@5.0.0 --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@5

      - name: Ensure Android project exists (generate if needed)
        run: |
          # Try to add the Android platform (no-op if already present)
          npx cap add android || true
          # Sync web assets into Android project
          npx cap sync android || true
          # Show android dir for debugging
          echo "Android directory contents:"
          ls -la android || true

      - name: Validate AndroidManifest and ensure admob string
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          ADMOB_ID="ca-app-pub-9057426786910647~7730878522"
          echo "Checking for manifest: $MANIFEST"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found at $MANIFEST"
            echo "List android tree for debugging:"
            ls -R android || true
            exit 1
          fi

          # Ensure values directory and strings.xml contain admob_app_id
          mkdir -p "$(dirname "$STRINGS_FILE")"
          if ! grep -q "admob_app_id" "$STRINGS_FILE" 2>/dev/null || [ ! -s "$STRINGS_FILE" ]; then
            echo "Creating or updating $STRINGS_FILE with admob_app_id"
            cat > "$STRINGS_FILE" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
  <string name="app_name">Holy Bible</string>
  <string name="title_activity_main">Holy Bible</string>
  <string name="admob_app_id">REPLACE_ME</string>
</resources>
EOF
            # Insert the real ID
            sed -i "s|REPLACE_ME|$ADMOB_ID|" "$STRINGS_FILE"
          else
            # Update admob_app_id if present (or append)
            if grep -q "admob_app_id" "$STRINGS_FILE"; then
              sed -i "s|<string name=\"admob_app_id\">.*</string>|<string name=\"admob_app_id\">$ADMOB_ID</string>|" "$STRINGS_FILE"
            else
              # Append admob_app_id before closing </resources>
              sed -i "/<\/resources>/i \ \ <string name=\"admob_app_id\">$ADMOB_ID</string>" "$STRINGS_FILE"
            fi
          fi

          # Idempotently insert or update the meta-data element in AndroidManifest.xml
          echo "Injecting or updating AdMob meta-data in AndroidManifest.xml"
          awk -v id="$ADMOB_ID" '
            BEGIN { inserted=0 }
            {
              print
            }
            /<\/application>/ && inserted==0 {
              # Only add if not already present in file
              # We'll scan previous lines for APPLICATION_ID presence
              inserted=1
            }
          ' "$MANIFEST" > "$MANIFEST.tmp"

          if grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$MANIFEST"; then
            echo "Existing AdMob meta-data found — updating value"
            sed -i 's|android:value="ca-app-pub-[^~]*~[^"]*"|android:value="'"$ADMOB_ID"'"|' "$MANIFEST"
            rm -f "$MANIFEST.tmp"
          else
            # Insert meta-data before closing </application>
            awk -v id="$ADMOB_ID" '{
              if (match($0, /<\/application>/) && !done) {
                print "        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"" id "\"/>"
                done=1
              }
              print $0
            }' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          fi

          echo "Manifest injection complete. Preview:"
          sed -n '1,240p' "$MANIFEST" || true
          echo "Preview strings.xml:"
          sed -n '1,240p' "$STRINGS_FILE" || true

      - name: Prepare icons in public folder
        run: |
          cp android-icons/mipmap-xxxhdpi/ic_launcher.png public/icon.png || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Set versionCode and versionName
        run: |
          BUILD_NUM=${{ github.run_number }}
          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionCode .*/versionCode $BUILD_NUM/" android/app/build.gradle || true
            sed -i "s/versionName .*/versionName \"2.2.$BUILD_NUM\"/" android/app/build.gradle || true
            grep -E "versionCode|versionName" android/app/build.gradle || true
          else
            echo "android/app/build.gradle not found — skipping version bump"
          fi

      - name: Setup signing keystore
        id: keystore
        run: |
          KS="${{ github.workspace }}/bible.keystore"
          KS_PASS="HolyBible2025"
          ALIAS="holybible"
          KEY_PASS="HolyBible2025"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from secret..."
            printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > "$KS"
            KS_PASS="${{ secrets.STORE_PASSWORD }}"
            ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No KEYSTORE_BASE64 secret provided — generating a dev keystore (not for production)"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=Holy Bible,OU=App,O=VedaVachanam,L=TamilNadu,S=TamilNadu,C=IN" -storetype PKCS12
          fi

          echo "KS_FILE=$KS"       >> $GITHUB_ENV
          echo "KS_PASS=$KS_PASS"  >> $GITHUB_ENV
          echo "KS_ALIAS=$ALIAS"   >> $GITHUB_ENV
          echo "KS_KPASS=$KEY_PASS" >> $GITHUB_ENV

      - name: Build (Debug or Release)
        working-directory: android
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file="${{ env.KS_FILE }}" -Pandroid.injected.signing.store.password="${{ env.KS_PASS }}" -Pandroid.injected.signing.key.alias="${{ env.KS_ALIAS }}" -Pandroid.injected.signing.key.password="${{ env.KS_KPASS }}" --no-daemon
          fi

      - name: Upload APK / AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HolyBible-APK-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release*.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
